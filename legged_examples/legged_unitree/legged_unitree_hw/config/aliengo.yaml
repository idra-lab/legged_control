# controller_manager of the real Aliengo, loaded by aliengo_launch.xml over legged_controllers/config/controllers.yaml
# (the controllers). power_limit and contact_threshold are hardware parameters of the URDF: arguments of
# legged_unitree_hw_launch.xml.
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz: read() and write() exchange one UDP packet with the robot per cycle
    thread_priority: 95  # SCHED_FIFO, needs the rtprio limit of the README
