# FAST-LIO (src/FAST_LIO_SLAM_ROS2/FAST_LIO_ROS2) on the simulated RoboSense Airy of the Aliengo
# (legged_unitree_description/urdf/common/robosense_airy.xacro, mounted in urdf/robot.xacro).
#
# The Airy is pitched 15 deg forward, so imu_R rotates the IMU readings into a frame with the base
# orientation (the rslidar_joint rotation, rpy="0 15deg 0"). FAST-LIO then estimates that upright frame:
# camera_init, /Odometry and /cloud_registered_body are gravity-aligned when the robot starts level.
# The IMU sits at the rslidar origin and /rslidar_points is in rslidar, so the lidar->body extrinsic is the
# same rotation with zero translation.
# Keep imu_R and extrinsic_R in sync with the mount in robot.xacro.
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 4              # every 4th of the 900 columns: 21600 of the 86400 points per scan go to
                                         # FAST-LIO and on to /cloud_registered (terrain, TARE, SC-PGO keyframes, map)
        max_iteration: 3
        filter_size_surf: 0.3
        filter_size_map: 0.3
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: ""

        common:
            lid_topic: "/rslidar_points"
            imu_topic: "/rslidar_imu_data"
            lid_reliable: true           # the 900 x 96 clouds are over 2 MB: best effort loses a third of them
            body_frame: "rslidar_lio"    # not rslidar: that one is already in the URDF TF tree
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            # Not 1-4 (Livox, Velodyne, Ouster, MID360): the default handler reads plain x y z intensity, skips
            # the NaN no-return points and applies no per-point motion compensation, right for the
            # instantaneous Gazebo scans
            lidar_type: 5
            scan_line: 96
            blind: 0.1                   # Airy blind zone; the legs are out of view of the top mount
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 60.0              # Airy max range
            extrinsic_est_en: false      # exact in simulation
            extrinsic_T: [0.0, 0.0, 0.0]
            extrinsic_R: [0.965926, 0.0, 0.258819,
                          0.0,      1.0, 0.0,
                          -0.258819, 0.0, 0.965926]
            imu_R: [0.965926, 0.0, 0.258819,
                    0.0,      1.0, 0.0,
                    -0.258819, 0.0, 0.965926]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en: true
            dense_publish_en: true
            scan_bodyframe_pub_en: true  # SC-PGO keyframes

        pcd_save:
            pcd_save_en: false
            interval: -1
