controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    legged_controller:
      type: legged/LeggedController

joint_state_broadcaster:
  ros__parameters:
    frame_id: base_link
    map_interface_to_joint_state:
      effort: effort
      position: position
      velocity: velocity
    use_local_topics: false
    use_urdf_to_filter: false

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: base_imu
    frame_id: base_imu
    publish_rate: 100.0

legged_controller:
  ros__parameters: {}
