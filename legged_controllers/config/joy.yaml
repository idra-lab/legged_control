teleop:
  walk:
    type: topic
    message_type: geometry_msgs/Twist
    topic_name: cmd_vel
    deadman_buttons: [ 4 ]
    axis_mappings:
      - axis: 0
        target: linear.y
        scale: 0.5
      - axis: 1
        target: linear.x
        scale: 0.5
      - axis: 3
        target: angular.z
        scale: 1.5
  standup:
    type: topic
    message_type: geometry_msgs/Twist
    topic_name: cmd_vel
    deadman_buttons: [ 0 ]
    message_value:
    - 
      target: linear.z
      value: 0.2
    - 
      target: linear.x
      value: 0.0
    -
      target: linear.y
      value: 0.0
      
  trot:
    type: topic
    message_type: ocs2_msgs/mode_schedule
    topic_name: legged_robot_mpc_mode_schedule
    deadman_buttons: [ 3 ]
    message_value:
    - 
      target: eventTimes
      value: [0.0, 0.35, 0.7]
    - 
      target: modeSequence
      value: [9, 6]
    
  stance:
    type: topic
    message_type: ocs2_msgs/mode_schedule
    topic_name: legged_robot_mpc_mode_schedule
    deadman_buttons: [ 2 ]
    message_value:
    - 
      target: eventTimes
      value: [0.0, 0.5]
    - 
      target: modeSequence
      value: [15]
  
  shutdown: 
      type: service
      interface_type: legged_controllers/srv/KillNode
      service_name: /kill_node_sigint
      service_request:
        node_name: /legged_unitree_hw
      buttons: [1]  
    
    
