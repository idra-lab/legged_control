robot:
  h_com: 0.38                   # m
  g: 9.81                       # m/s^2
  m: 22.647                     # kg
  Iz: 1.048                     # kg/m^2
  off_x: 0.2407                 # m
  off_y: 0.134                  # m
  mu: 0.6                       #
  max_ext_sq: 0.0625              # 0.25 * 0.25
  x_init: [-0.8, -0.5]          # m
  theta_init: 0.0               # rad
  leg_length: 0.25              # m, thigh and calf
  foot_radius: 0.0265           # m, same as URDF



limits:
  dt_min: 0.2                   # sec
  dt_max: 0.3                   # sec
  theta_dot_max: 0.6            # rad/sec
  v_max_x: 1.5                  # m/s
  v_max_y: 0.45                 # m/s
  alpha_min: 0.1                #
  alpha_max: 0.9                #
  tau_max_hip: 35.278           # Nm, HAA and HFE, same as URDF and task.info
  tau_max_knee: 44.4            # Nm, KFE

ocp_weights:
  tracking_xy: 5.0      
  vel_alignment: 10.0
  vel_xy: 5.0
  time_weight: 0.000001
  yaw_rate: 1.0
  anti_skating: 10.0
  posture: 10000.0              # 1e4
  alpha_weight: 1.0
  dt_weight: 0.001              # 1e-3
  heading_goal: 20.0            # theta -> theta_goal close to the goal (cos/sin error, no wrap at +-pi)

simulation:
  N_horizon: 6
  sim_steps: 300
  step_per_phase: 1
  c_target: [10.0, -2.0]        # m
  max_lookahead: 10.0           # m
  goal_tolerance: 0.15          # m, WALK -> STANCE when closer than this to c_target
  feet_tolerance: 0.04          # m, stop at the goal only every foot is this close to its nominal footholds under the hip
  max_settle_steps: 6           # number of steps at the goal waiting fot he feet, then stop anyway  
  theta_target: 0.0             # rad, goal yaw at start (then the orientation of /goal_pose)
  max_iter: 2

# Heading: far from the goal face the velocity (goes around the obstacles looking where it walks),
# close to the goal reach the goal yaw. Blend per MPC node on the predicted distance from the goal
heading:
  blend_dist: [0.4, 1.2]        # m, [d_near, d_far]: only goal yaw below d_near, only velocity above d_far
  yaw_tolerance: 0.10           # rad, WALK -> STANCE only if also the yaw error is below this



# Obstacles 
# Radius and speed bound per class of legged_controllers/msg/Obstacle (same values of task.info obstacleTypes):
# the topic carries only class and position
obstacle_types:
  human: {radius: 0.2, y_dot_max: 1.0}
  car: {radius: 2.4, y_dot_max: 2.0}


obstacles:
  N_OBS_MAX: 3
  obs_pos_init: [0.1, 1.0]      # m
  r_obs: 0.2                    # m
  speed: 0.5                    # m/s
  y_dot_max: 1.0                # m/s
  top_pos_dyn: [0.1, 1.0]       # m
  bot_pos_dyn: [0.1, -1.0]      # m
  obs_type: "random"            # static, dynamic, adversarial, circular, random
  obs_center: [1.0, 0.2]        # m
  instances: 
    - {type: "dynamic", class: "human", pos: [2.0, 0.5], pos_end: [2.0, -0.5], r_obs: 0.15, speed: 0.2, y_dot_max: 1.0}                
    # - {type: "adversarial", pos: [2.0, 1.0], r_obs: 0.3, speed: 0.5, y_dot_max: 1.0}
  # {type: "static", pos: [1.5, 0.1], r_obs: 0.3, y_dot_max: 0.1}
  # {type: "dynamic", pos: [5.0, 5.0], pos_end: [5.0, -5.0], r_obs: 0.3, speed: 0.5, y_dot_max: 1.0}
  # {type: "adversarial", pos: [2.0, 1.0], r_obs: 0.3, speed: 0.5, y_dot_max: 1.0}
  random:
    count: 0                    # 0 = 0ff
    seed: 42
    bounds: [2.0, 9.0, -2.0, 2.0]
    r_range: [0.1, 0.4]         # m
    speed_range: [0.5, 0.8]     # m/s
    y_dot_max: 1.0              # m/s, never lower than highest speed


# CoM, orientation and swing-foot gains are those of OptiPessiWbc in task.info (optiPessiWbc, swingLegTask)
controller:
  standup_duration: 2.0         # sec
  kp_stand: 150.0               # joint PD of STAND_UP, faded out over stance_blend
  kd_stand: 4.0
  kd_wbc: 3.0                   # joint damping with the WBC torques, all joints (OptiPessiController)
  stance_blend: 1.0             # sec
  swing_height: 0.080            # m
  com_height: 0.38              # m, whole-body CoM height tracked by the WBC (h_com stays the one of the acados model). The CoM is ~1.1 cm below the base: 0.37 = base at ~0.38
  damping_kd: 10.0              # Nm/(rad/s): in DAMPING kp=0, tau = 0, only damping
  max_tilt: 0.6                 # rad, for the max roll or pitch
  max_tilt_rate: 8.0            # rad/s, filtered roll/pitch velocity: extreme limit only, the predicted tilt acts before
  min_base_height: 0.20         # m
  max_com_error: 0.15           # m, CoM error in WALK
  max_solver_failures: 1        # consecutive solver failures then DAMPING
  max_solution_age: 0.2           # s, maximum age of the MPC solution in WALK
  # Predicted tilt: angle + rate * lookahead, the rate counts only when it moves the robot away from upright
  tilt_lookahead: 0.08          # s
  tilt_filter_hz: 10.0          # Hz, low-pass on the roll/pitch rates (impacts of the feet)
  tilt_ticks: 12                 # consecutive ticks over max_tilt before DAMPING (30 ms at 400 Hz)
  # Fall: brace (low and wide pose), then damping
  hard_fall_tilt: 0.9           # rad, over this damping only, no brace
  brace_duration: 2           # s
  brace_ramp: 2               # s, smoothstep from the current pose to the brace pose
  kp_brace: 50.0
  kd_brace: 4.0
  brace_haa: 0.2                # rad, legs open outwards
  brace_hfe: 1.1                # rad
  brace_kfe: -2.4               # rad, URDF limit -2.77
